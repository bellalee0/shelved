# 폐기 가능한 로컬 DB (backend.md 환경별 스키마 관리)
spring:
  jpa:
    hibernate:
      ddl-auto: update

# 로컬에서만 Swagger UI 노출: http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

shelved:
  dev-seed:
    # 개발용 시드 폴더. 기동 시 이 폴더의 *.json을 PUBLISHED 사건으로 1회 반영한다 (README 개발용 시드)
    path: classpath:dev-data/
